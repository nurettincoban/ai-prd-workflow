name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    name: Shellcheck scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck install.sh copy-prompt.sh scripts/test-install.sh

  prompt-checks:
    name: Prompt contracts, shared sections, versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Contracts hold, shared sections match shared/, version numbers agree
        run: python3 scripts/check-prompts.py

  trace-check:
    name: trace-check tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The scripts promise Python 3.8+; an older interpreter is the reliable
        # way to catch syntax that only newer versions accept.
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests for the traceability checker
        run: python -m unittest discover scripts -v

  skills:
    name: Generated skills and install.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: skills/ matches the prompt sources
        # `git status --porcelain` also catches generated files that were never
        # committed; `git diff --exit-code` only sees changes to tracked files.
        run: |
          ./install.sh --build
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff
            echo ""
            echo "::error::skills/ is out of sync with the source prompts."
            echo "Run './install.sh --build' locally and commit the result."
            exit 1
          fi
      - name: install.sh end-to-end tests
        run: bash scripts/test-install.sh

  plugin-manifests:
    name: Plugin manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON and cross-check names
        run: |
          python3 - <<'EOF'
          import json, os
          plugin = json.load(open(".claude-plugin/plugin.json"))
          market = json.load(open(".claude-plugin/marketplace.json"))
          assert plugin["name"] in {p["name"] for p in market["plugins"]}, "marketplace must list the plugin"
          assert "commands" not in plugin, "the plugin ships skills/, not commands"
          skills = [d for d in os.listdir("skills") if os.path.isfile(os.path.join("skills", d, "SKILL.md"))]
          assert skills, "skills/ is empty"
          print(f"plugin manifests OK, {len(skills)} skills")
          EOF
