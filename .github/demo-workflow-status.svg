<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 446" width="900" height="446" role="img" aria-labelledby="title desc">
  <title id="title">/workflow-status auditing the v2.0 url-shortener example</title>
  <desc id="desc">A condensed replay of a real run. trace-check fails twice: F7, a Must Have, is in no RFC, and RFCS.md is missing. Reading the documents against each other finds that no RFC builds the promised UI, that HTTP 301 caching breaks click counts and deletion, that RFC-003 hides a dependency on RFC-002, that the alias rules contradict each other, and that zero data loss conflicts with fire-and-forget writes: 20 inconsistencies in total. Next step: /verify-prd.</desc>
  <style>
    .t { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; font-size: 14px; fill: #e6edf3; }
    .dim { fill: #8b949e; }
    .ok { fill: #3fb950; }
    .bad { fill: #f85149; }
    .acc { fill: #e3936f; }
    .ln { opacity: 0; animation: show .3s ease-out forwards; }
    @keyframes show { to { opacity: 1; } }
    .cover { animation: type 1.1s steps(16) .6s forwards; }
    @keyframes type { to { transform: translateX(240px); } }
    @media (prefers-reduced-motion: reduce) {
      .ln { animation: none; opacity: 1; }
      .cover { display: none; }
    }
  </style>

  <rect x="0.5" y="0.5" width="899" height="445" rx="10" fill="#0d1117" stroke="#30363d"/>
  <path d="M1 32 H899" stroke="#30363d"/>
  <circle cx="20" cy="16.5" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="16.5" r="6" fill="#febc2e"/>
  <circle cx="60" cy="16.5" r="6" fill="#28c840"/>
  <text class="t dim" x="450" y="21" text-anchor="middle" font-size="12">examples/url-shortener/before</text>

  <!-- the command, typed -->
  <text class="t" x="24" y="66"><tspan class="ok">❯</tspan><tspan x="44">/workflow-status</tspan></text>
  <rect class="cover" x="42" y="50" width="240" height="22" fill="#0d1117"/>

  <text class="t ln" x="24" y="110" style="animation-delay:2.0s"><tspan class="acc">●</tspan><tspan x="44" class="dim">Running trace-check.py</tspan></text>
  <text class="t ln" x="44" y="132" style="animation-delay:2.5s"><tspan class="bad">FAIL</tspan><tspan x="92">F7 (Must have) is not assigned to any RFC</tspan></text>
  <text class="t ln" x="44" y="154" style="animation-delay:2.8s"><tspan class="bad">FAIL</tspan><tspan x="92">RFCs exist but the RFCS.md index does not</tspan></text>

  <text class="t ln" x="24" y="198" style="animation-delay:3.8s"><tspan class="acc">●</tspan><tspan x="44" class="dim">Reading the PRD, features, rules and 3 RFCs against each other</tspan></text>
  <text class="t ln" x="44" y="220" style="animation-delay:4.6s"><tspan class="bad">✗</tspan><tspan x="64">No RFC builds the UI the PRD promises; RFC-002 claims F5, F6, F11 but tests only the API</tspan></text>
  <text class="t ln" x="44" y="242" style="animation-delay:5.1s"><tspan class="bad">✗</tspan><tspan x="64">HTTP 301 is cached by browsers: repeat clicks go uncounted, deleted links keep working</tspan></text>
  <text class="t ln" x="44" y="264" style="animation-delay:5.6s"><tspan class="bad">✗</tspan><tspan x="64">RFC-003 deletes RFC-002's click data but declares only RFC-001 as a predecessor</tspan></text>
  <text class="t ln" x="44" y="286" style="animation-delay:6.1s"><tspan class="bad">✗</tspan><tspan x="64">The alias regex allows hyphens; the PRD and the RFC's own criterion say alphanumeric</tspan></text>
  <text class="t ln" x="44" y="308" style="animation-delay:6.6s"><tspan class="bad">✗</tspan><tspan x="64">"Zero data loss" in the PRD vs fire-and-forget click writes in RFC-002</tspan></text>
  <text class="t ln dim" x="64" y="330" style="animation-delay:7.2s">… 20 inconsistencies in total</text>

  <text class="t ln" x="24" y="374" style="animation-delay:8.0s"><tspan class="acc">Next step:</tspan><tspan x="116">/verify-prd</tspan><tspan x="220" class="dim">(9 of these need a fix or a decision in PRD.md)</tspan></text>

  <path d="M1 404 H899" stroke="#30363d"/>
  <text class="t dim" x="24" y="429" font-size="12">Replay of a real run, condensed. Full report: examples/url-shortener/workflow-status-on-before.md</text>
</svg>
